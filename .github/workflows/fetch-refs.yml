name: fetch-refs
on: push
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch reference pages
        run: |
          cat > strip.py <<'PY'
          import re, html, sys
          s = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          s = re.sub(r'(?is)<(script|style).*?</\1>', ' ', s)
          s = re.sub(r'(?s)<[^>]+>', '\n', s)
          s = re.sub(r'\n\s*\n+', '\n', html.unescape(s)).strip()
          print(s[:30000])
          PY
          for p in privacy-page.html terms-page.html contact-page.html; do
            code=$(curl -sSL --max-time 30 -o page.html -w '%{http_code}' "https://recipics.app/$p" || echo 000)
            echo "@@@@@ BEGIN $p ($code, $(wc -c < page.html) bytes)"
            [ "$code" = "200" ] && python3 strip.py page.html
            echo "@@@@@ END $p"
          done
