name: fetch-refs
on: push
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Discover links
        run: |
          curl -sSL --max-time 30 https://recipics.app/ -o home.html || true
          echo "=== HOME $(wc -c < home.html) bytes"
          grep -oiE 'href="[^"]+"' home.html | sort -u || true
      - name: Fetch candidate policy pages
        run: |
          cat > strip.py <<'PY'
          import re, html, sys
          s = open('page.html', encoding='utf-8', errors='replace').read()
          s = re.sub(r'(?is)<(script|style).*?</\1>', ' ', s)
          s = re.sub(r'(?s)<[^>]+>', '\n', s)
          s = re.sub(r'\n\s*\n+', '\n', html.unescape(s)).strip()
          print(s[:14000])
          PY
          for p in privacy privacy-policy privacy.html terms terms-of-service terms.html eula support; do
            code=$(curl -sSL --max-time 30 -o page.html -w '%{http_code}' "https://recipics.app/$p" || echo 000)
            echo "=== https://recipics.app/$p -> $code"
            if [ "$code" = "200" ]; then python3 strip.py; fi
          done
