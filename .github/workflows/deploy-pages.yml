name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Let a publish finish before the next one starts; queue at most one behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://vskromny.github.io/mealog-website/
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages serves the gh-pages branch for this repo, so publishing
      # means mirroring main onto it. main stays the branch you edit.
      - name: Mirror main onto gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"sha":"%s","ref":"%s","built":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build-info.json
          git add build-info.json
          git commit -m "Publish $GITHUB_SHA"
          git push --force origin HEAD:gh-pages

      # Wait for the Pages build to serve THIS commit, not just any page.
      - name: Wait for the deploy to go live
        run: |
          for i in $(seq 1 30); do
            live=$(curl -sS "$SITE_URL/build-info.json?cachebust=$RANDOM" || true)
            case "$live" in *"$GITHUB_SHA"*) echo "live: $live"; exit 0;; esac
            echo "attempt $i: not live yet"
            sleep 10
          done
          echo "::error::$GITHUB_SHA did not go live within 5 minutes"
          exit 1

      # A green run should mean a working page, not just a successful push.
      - name: Verify the published page
        run: |
          curl -sSf -o page.html "$SITE_URL"
          grep -q "<title>Mealog" page.html || { echo "::error::title missing"; exit 1; }
          for asset in assets/dc-runtime.js assets/logo/mealog-logo.svg \
                       assets/screens/today-660.webp site.webmanifest \
                       privacy.html terms.html; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE_URL$asset")
            echo "$asset -> $code"
            [ "$code" = "200" ] || { echo "::error::$asset returned HTTP $code"; exit 1; }
          done
          echo "Live and complete: $SITE_URL"
