name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on for the repo if it is not configured
      # yet, so no manual switch in Settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files at the repo root — nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      # Fetch what was actually published, so a green run means a working
      # page rather than just a successful upload.
      - name: Verify the deployed site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in $(seq 1 10); do
            code=$(curl -sS -o page.html -w '%{http_code}' "$url" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $i: HTTP $code — retrying"
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::page returned HTTP $code"; exit 1; }
          grep -q "<title>Mealog" page.html || { echo "::error::title missing"; exit 1; }
          for asset in assets/dc-runtime.js assets/logo/mealog-logo.svg \
                       assets/screens/today-660.webp site.webmanifest; do
            acode=$(curl -sS -o /dev/null -w '%{http_code}' "$url$asset")
            echo "$asset -> $acode"
            [ "$acode" = "200" ] || { echo "::error::$asset returned HTTP $acode"; exit 1; }
          done
          echo "Live and complete: $url"
